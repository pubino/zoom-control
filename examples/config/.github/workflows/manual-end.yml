name: Manual end (runbook)
on:
  workflow_dispatch:
    inputs:
      event: { description: Event uid, required: true }

permissions:
  contents: read

jobs:
  end:
    # Runs on the node that holds the host's user-level Zoom authorization (keychain).
    runs-on: [self-hosted, macOS, zoom-api]
    steps:
      - uses: actions/checkout@v5
      - uses: pubino/zoom-control/.github/actions/setup-zoomctl@v0.1.0
      - run: zoomctl end -c . --event "${{ inputs.event }}"
