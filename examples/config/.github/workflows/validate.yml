name: Validate
on:
  pull_request:
    paths: ["rooms/**", "events/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pu-shd/zoom-control/.github/actions/setup-zoomctl@v0.1.0
      - run: zoomctl validate -c .

  plan:
    needs: validate
    # Needs the host's Zoom authorization, which lives only on the zoom-api node.
    # Only collaborators can open PRs here (private repo, fork PR workflows disabled).
    runs-on: [self-hosted, macOS, zoom-api]
    steps:
      - uses: actions/checkout@v5
      - uses: pu-shd/zoom-control/.github/actions/setup-zoomctl@v0.1.0
      - run: zoomctl plan -c . --markdown plan.md
      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file plan.md --edit-last --create-if-none
