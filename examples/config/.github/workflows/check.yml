name: Check Zoom setup
# Verifies secrets, scopes, host licenses and the alert webhook (docs/zoom-setup.md).
# Needs zoom-control >= v0.1.1.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # Runs on the node that holds the host's user-level Zoom authorization (keychain).
    runs-on: [self-hosted, macOS, zoom-api]
    steps:
      - uses: actions/checkout@v5
      - uses: pu-shd/zoom-control/.github/actions/setup-zoomctl@v0.1.0
      - env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: zoomctl check -c . --test-alert
