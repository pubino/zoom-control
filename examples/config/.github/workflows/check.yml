name: Check Zoom setup
# Verifies secrets, scopes, host licenses and the alert webhook (docs/zoom-setup.md).
# Needs zoom-control >= v0.1.1.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pubino/zoom-control/.github/actions/setup-zoomctl@v0.1.0
      - env:
          ZOOM_ACCOUNT_ID: ${{ secrets.ZOOM_ACCOUNT_ID }}
          ZOOM_CLIENT_ID: ${{ secrets.ZOOM_CLIENT_ID }}
          ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: zoomctl check -c . --test-alert
