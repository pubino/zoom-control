name: Reconcile
on:
  push:
    branches: [main]
    paths: ["rooms/**", "events/**"]
  schedule:
    - cron: "17 6 * * *"   # nightly drift repair
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconcile
  cancel-in-progress: false

jobs:
  apply:
    # Runs on the node that holds the host's user-level Zoom authorization (keychain).
    runs-on: [self-hosted, macOS, zoom-api]
    steps:
      - uses: actions/checkout@v5
      - uses: pu-shd/zoom-control/.github/actions/setup-zoomctl@v0.1.0
      - name: Apply specs to Zoom
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: zoomctl apply -c .
