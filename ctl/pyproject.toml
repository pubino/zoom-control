[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "zoomctl"
version = "0.1.0"
description = "Declarative, self-healing Zoom Webinar orchestration for unattended macOS room nodes"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "respx>=0.21",
]

[project.scripts]
zoomctl = "zoomctl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["zoomctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
