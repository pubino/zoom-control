services:
  test:
    build: { context: ., target: python-test }
  test-swift:
    build: { context: ., target: swift-test }
  zoomctl:
    build: { context: ., target: zoomctl }
    environment:
      - ALERT_WEBHOOK_URL
      - ZOOMCTL_TOKEN_STORE=file:/tokens
    # Tokens from `zoomctl auth login` run in this container (FileTokenStore). On room nodes the
    # macOS keychain is used instead.
    volumes:
      - ${ZOOMCTL_CONFIG:-./examples/config}:/config:ro
      - zoomctl-tokens:/tokens
    working_dir: /config

volumes:
  zoomctl-tokens:
